<!doctype html>
<!-- Dev gallery of every prop + Papa. ?cam=x,y,z&at=x,y,z to move the camera; ?papa=run|spank -->
<html><body style="margin:0;background:#9fd3ff">
<script type="module">
import * as THREE from '../vendor/three.module.js';
import { createProp } from '../src/props.js';
import { createStickman } from '../src/stickman.js';
const q = new URLSearchParams(location.search), v = (k, d) => (q.get(k) || d).split(',').map(Number);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.shadowMap.enabled = true;
document.body.append(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fd3ff);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a6a4a, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(5, 10, 8); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 }); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x555b63 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const layout = [['bus', -8, -6], ['auto', -4, -1], ['cow', -1.5, -1], ['cart', 1.5, -1], ['bricks', 4, 0], ['pothole', 6, 0],
  ['barricade', -5, 4], ['clothesline', 0, -8], ['banner', 3, 5]];
for (const [n, x, z] of layout) { const p = createProp(n); p.position.set(x, 0, z); p.rotation.y = 0.5; scene.add(p); }
const papa = createStickman('papa'); papa.group.position.set(-1.5, 0, 4); papa.group.rotation.y = q.has('back') ? 0 : Math.PI * 0.8; scene.add(papa.group);
papa.setMode(q.get('papa') || 'run'); for (let i = 0; i < 9; i++) papa.update(0.05, 12);
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
cam.position.set(...v('cam', '0,9,16')); cam.lookAt(...v('at', '0,0.5,0'));
r.render(scene, cam);
</script></body></html>
