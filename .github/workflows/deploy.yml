# On every push to master: test, publish the web game to GitHub Pages, build the Android APK into the "latest" release.
name: deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: deploy, cancel-in-progress: true }

jobs:
  web:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.pages.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
      - run: node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: pages
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci && node tools/build.mjs && npx cap sync android
      # With the upload key secret: Play-ready AAB + release APK signed with the same key (installs over older
      # builds). Without it: debug APK only.
      - env:
          KEYSTORE_B64: '${{ secrets.KEYSTORE_B64 }}'
          KEYSTORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}'
          VERSION_CODE: '${{ github.run_number }}'
        run: |
          cd android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease assembleRelease --no-daemon
            cp app/build/outputs/bundle/release/app-release.aab ../BhaagBetaBhaag.aab
            cp app/build/outputs/apk/release/app-release.apk ../BhaagBetaBhaag.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../BhaagBetaBhaag.apk
          fi
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # update in place (no delete/recreate, which can fail half-way and leave no download)
          NOTES="Build ${{ github.run_number }} from ${GITHUB_SHA::7}. BhaagBetaBhaag.aab = upload to Play Console. BhaagBetaBhaag.apk = install on a phone: Download on your phone, open it and allow 'Install unknown apps'. Uses live AdMob ads: never tap your own ads (register your phone as an AdMob test device)."
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Bhaag Beta Bhaag! (latest build)" --notes "$NOTES"
          gh release edit latest --notes "$NOTES"
          gh release upload latest BhaagBetaBhaag.apk $(ls BhaagBetaBhaag.aab 2>/dev/null) --clobber
